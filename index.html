<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Чат</title>
    <style>
        /* ===== Reset & Base ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: #0b0e14;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 16px;
        }

        /* ===== Main Container ===== */
        .app-container {
            width: 100%;
            max-width: 480px;
            height: 780px;
            max-height: 98vh;
            background: #151e2a;
            border-radius: 32px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.04);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* ===== Screens ===== */
        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.3s ease;
            background: #151e2a;
        }
        .screen.active {
            display: flex;
        }

        /* ===== LOGIN SCREEN ===== */
        #login-screen {
            justify-content: center;
            align-items: center;
            padding: 32px 24px;
            background: radial-gradient(ellipse at 50% 20%, #1d2b3a, #0b0e14);
        }
        #login-screen .logo {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #64b5f6, #4dd0e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }
        #login-screen .subtitle {
            color: #8899b0;
            font-size: 15px;
            margin-bottom: 40px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .accounts-grid {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }
        .account-card {
            background: #1d2b3a;
            border-radius: 24px;
            padding: 28px 32px 32px;
            width: 160px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            border: 2px solid transparent;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            user-select: none;
        }
        .account-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 255, 255, 0.08);
        }
        .account-card:active {
            transform: scale(0.96);
        }
        .account-card .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: 600;
            color: #fff;
            margin: 0 auto 14px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        .account-card .avatar.alina {
            background: linear-gradient(135deg, #4fc3f7, #0288d1);
        }
        .account-card .avatar.danik {
            background: linear-gradient(135deg, #ffa726, #ef6c00);
        }
        .account-card .name {
            font-size: 20px;
            font-weight: 600;
            color: #eef2f7;
            display: block;
        }
        .account-card .hint {
            font-size: 13px;
            color: #6a7f99;
            margin-top: 6px;
            font-weight: 400;
        }

        /* Selected state */
        .account-card.selected-alina {
            border-color: #4fc3f7;
            background: #1a2d3f;
            box-shadow: 0 0 30px rgba(79, 195, 247, 0.15);
        }
        .account-card.selected-danik {
            border-color: #ffa726;
            background: #2f2418;
            box-shadow: 0 0 30px rgba(255, 167, 38, 0.15);
        }

        /* ===== CHAT SCREEN ===== */
        #chat-screen {
            background: #0f1722;
        }

        /* Header */
        .chat-header {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            background: #151e2a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            min-height: 68px;
            gap: 12px;
        }
        .chat-header .back-btn {
            background: none;
            border: none;
            color: #8899b0;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 12px;
            transition: background 0.2s;
            line-height: 1;
        }
        .chat-header .back-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        .chat-header .header-info {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }
        .chat-header .header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            flex-shrink: 0;
        }
        .chat-header .header-avatar.alina {
            background: linear-gradient(135deg, #4fc3f7, #0288d1);
        }
        .chat-header .header-avatar.danik {
            background: linear-gradient(135deg, #ffa726, #ef6c00);
        }
        .chat-header .header-name {
            font-size: 17px;
            font-weight: 600;
            color: #eef2f7;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-header .header-status {
            font-size: 12px;
            color: #4fc3f7;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .chat-header .header-status .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4fc3f7;
            display: inline-block;
            animation: pulse-dot 1.5s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.85);
            }
        }
        .chat-header .header-status.offline .dot {
            background: #6a7f99;
            animation: none;
            opacity: 0.5;
        }

        /* Messages area */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            scroll-behavior: smooth;
            background: #0f1722;
        }
        .messages-area::-webkit-scrollbar {
            width: 4px;
        }
        .messages-area::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages-area::-webkit-scrollbar-thumb {
            background: #2a3a4e;
            border-radius: 10px;
        }

        /* Message bubble */
        .message {
            display: flex;
            flex-direction: column;
            max-width: 88%;
            animation: fade-up 0.25s ease;
        }
        @keyframes fade-up {
            0% {
                opacity: 0;
                transform: translateY(12px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .message .msg-sender {
            font-size: 12px;
            font-weight: 600;
            color: #8899b0;
            margin-bottom: 2px;
            padding-left: 12px;
            letter-spacing: 0.2px;
        }
        .message .msg-bubble {
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            background: #1d2b3a;
            color: #eef2f7;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        .message .msg-time {
            font-size: 10px;
            color: #5a6f88;
            margin-top: 3px;
            padding-left: 12px;
            opacity: 0.7;
        }

        /* Alina theme messages */
        .message.alina .msg-bubble {
            background: linear-gradient(135deg, #1a3a52, #0f2a3f);
            border-left: 3px solid #4fc3f7;
        }
        .message.alina .msg-sender {
            color: #4fc3f7;
        }

        /* Danik theme messages */
        .message.danik .msg-bubble {
            background: linear-gradient(135deg, #3d2818, #2d1c0e);
            border-left: 3px solid #ffa726;
        }
        .message.danik .msg-sender {
            color: #ffa726;
        }

        /* Current user's messages (right-aligned) */
        .message.self {
            align-self: flex-end;
            align-items: flex-end;
        }
        .message.self .msg-sender {
            padding-right: 12px;
            padding-left: 0;
        }
        .message.self .msg-bubble {
            background: #1d3348;
            border-left: none;
            border-right: 3px solid #4fc3f7;
        }
        .message.self .msg-time {
            padding-right: 12px;
            padding-left: 0;
        }
        /* Override for Danik self */
        .message.self.danik .msg-bubble {
            border-right-color: #ffa726;
        }

        /* System message */
        .message.system {
            align-self: center;
            max-width: 92%;
        }
        .message.system .msg-bubble {
            background: rgba(255, 255, 255, 0.04);
            color: #6a7f99;
            font-size: 13px;
            padding: 6px 16px;
            border-radius: 30px;
            text-align: center;
            border: none;
            box-shadow: none;
        }
        .message.system .msg-sender {
            display: none;
        }
        .message.system .msg-time {
            display: none;
        }

        /* ===== Input Area ===== */
        .input-area {
            display: flex;
            gap: 10px;
            padding: 12px 20px 18px;
            background: #151e2a;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            align-items: center;
        }
        .input-area input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 30px;
            border: none;
            background: #1d2b3a;
            color: #eef2f7;
            font-size: 15px;
            outline: none;
            transition: background 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }
        .input-area input::placeholder {
            color: #5a6f88;
        }
        .input-area input:focus {
            background: #243544;
            box-shadow: 0 0 0 2px rgba(79, 195, 247, 0.2);
        }
        .input-area input:focus.danik-focus {
            box-shadow: 0 0 0 2px rgba(255, 167, 38, 0.2);
        }
        .input-area .send-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            font-family: inherit;
            background: linear-gradient(135deg, #4fc3f7, #0288d1);
        }
        .input-area .send-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 16px rgba(79, 195, 247, 0.3);
        }
        .input-area .send-btn:active {
            transform: scale(0.96);
        }
        .input-area .send-btn.danik-btn {
            background: linear-gradient(135deg, #ffa726, #ef6c00);
        }
        .input-area .send-btn.danik-btn:hover {
            box-shadow: 0 4px 16px rgba(255, 167, 38, 0.3);
        }
        .input-area .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ===== Connection status bar ===== */
        .connection-status {
            padding: 4px 20px;
            font-size: 12px;
            text-align: center;
            background: #151e2a;
            color: #6a7f99;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            min-height: 30px;
        }
        .connection-status .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            transition: background 0.3s;
        }
        .connection-status .status-dot.connected {
            background: #4fc3f7;
        }
        .connection-status .status-dot.disconnected {
            background: #e74c3c;
        }
        .connection-status .status-dot.connecting {
            background: #f1c40f;
            animation: pulse-dot 0.8s ease-in-out infinite;
        }

        /* ===== Responsive ===== */
        @media (max-width: 520px) {
            .app-container {
                border-radius: 0;
                height: 100vh;
                max-height: 100vh;
                padding: 0;
                max-width: 100%;
            }
            body {
                padding: 0;
                background: #0b0e14;
            }
            .account-card {
                width: 140px;
                padding: 20px 16px 24px;
            }
            .account-card .avatar {
                width: 64px;
                height: 64px;
                font-size: 28px;
            }
            #login-screen .logo {
                font-size: 36px;
            }
            .accounts-grid {
                gap: 14px;
            }
            .chat-header {
                padding: 12px 16px;
                min-height: 60px;
            }
            .messages-area {
                padding: 12px 14px 8px;
            }
            .input-area {
                padding: 10px 14px 14px;
                gap: 8px;
            }
            .input-area input {
                padding: 10px 14px;
                font-size: 14px;
            }
            .input-area .send-btn {
                padding: 10px 18px;
                font-size: 14px;
            }
            .message .msg-bubble {
                font-size: 14px;
                padding: 8px 14px;
            }
        }
        @media (max-width: 380px) {
            .account-card {
                width: 120px;
                padding: 16px 12px 20px;
            }
            .account-card .avatar {
                width: 54px;
                height: 54px;
                font-size: 22px;
            }
            .account-card .name {
                font-size: 17px;
            }
            .accounts-grid {
                gap: 10px;
            }
        }

        /* Scrollbar for Firefox */
        .messages-area {
            scrollbar-width: thin;
            scrollbar-color: #2a3a4e transparent;
        }

        /* ===== Utility ===== */
        .hidden {
            display: none !important;
        }
        .text-center {
            text-align: center;
        }
        .mt-8 {
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">

        <!-- ===== LOGIN SCREEN ===== -->
        <div class="screen active" id="login-screen">
            <div class="logo">💬 Чат</div>
            <div class="subtitle">Выберите аккаунт для входа</div>
            <div class="accounts-grid">
                <!-- Алина -->
                <div class="account-card" data-account="alina" id="card-alina">
                    <div class="avatar alina">А</div>
                    <span class="name">Алина</span>
                    <span class="hint">сине-голубая тема</span>
                </div>
                <!-- Даник -->
                <div class="account-card" data-account="danik" id="card-danik">
                    <div class="avatar danik">Д</div>
                    <span class="name">Даник</span>
                    <span class="hint">оранжевая тема</span>
                </div>
            </div>
        </div>

        <!-- ===== CHAT SCREEN ===== -->
        <div class="screen" id="chat-screen">
            <!-- Header -->
            <div class="chat-header">
                <button class="back-btn" id="back-btn" aria-label="Назад">‹</button>
                <div class="header-info">
                    <div class="header-avatar" id="header-avatar">А</div>
                    <div>
                        <div class="header-name" id="header-name">Алина</div>
                        <div class="header-status" id="header-status">
                            <span class="dot"></span> Подключено
                        </div>
                    </div>
                </div>
            </div>

            <!-- Messages -->
            <div class="messages-area" id="messages-area">
                <!-- Messages will be injected here -->
                <div class="message system">
                    <div class="msg-bubble">Добро пожаловать в чат! Выберите аккаунт и начните общение.</div>
                </div>
            </div>

            <!-- Input -->
            <div class="input-area">
                <input type="text" id="msg-input" placeholder="Введите сообщение..." autocomplete="off" />
                <button class="send-btn" id="send-btn">Отправить</button>
            </div>

            <!-- Connection status -->
            <div class="connection-status" id="connection-status">
                <span class="status-dot connecting" id="status-dot"></span>
                <span id="status-text">Подключение...</span>
            </div>
        </div>

    </div>

    <script>
        // ================================================================
        //  Адрес WebSocket – автоматически подхватывает текущий хост
        //  Если сервер запущен на localhost:8000, то ws://localhost:8000/ws
        // ================================================================
        const WS_SERVER_URL = `ws://${window.location.host}/ws`;

        // ===== State =====
        const state = {
            account: null, // 'alina' | 'danik' | null
            ws: null,
            connected: false,
            messages: [],
        };

        // ===== DOM refs =====
        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);

        const loginScreen = $('#login-screen');
        const chatScreen = $('#chat-screen');
        const cards = $$('.account-card');
        const backBtn = $('#back-btn');
        const headerAvatar = $('#header-avatar');
        const headerName = $('#header-name');
        const headerStatus = $('#header-status');
        const messagesArea = $('#messages-area');
        const msgInput = $('#msg-input');
        const sendBtn = $('#send-btn');
        const statusDot = $('#status-dot');
        const statusText = $('#status-text');

        // ===== Account data =====
        const ACCOUNTS = {
            alina: {
                id: 'alina',
                name: 'Алина',
                avatarLetter: 'А',
                theme: 'alina',
                primaryColor: '#4fc3f7',
                darkColor: '#0288d1',
                lightColor: '#b3e5fc',
                cssClass: 'alina',
                headerClass: 'alina',
                btnClass: '',
                focusClass: '',
            },
            danik: {
                id: 'danik',
                name: 'Даник',
                avatarLetter: 'Д',
                theme: 'danik',
                primaryColor: '#ffa726',
                darkColor: '#ef6c00',
                lightColor: '#ffe0b2',
                cssClass: 'danik',
                headerClass: 'danik',
                btnClass: 'danik-btn',
                focusClass: 'danik-focus',
            },
        };

        // ===== Helpers =====
        function formatTime(ts) {
            const d = new Date(ts);
            return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        }

        function getCurrentTimeISO() {
            return new Date().toISOString();
        }

        function scrollToBottom() {
            setTimeout(() => {
                messagesArea.scrollTop = messagesArea.scrollHeight;
            }, 20);
        }

        // ===== Render message =====
        function renderMessage(data) {
            const { sender, content, timestamp, type } = data;
            const isSystem = type === 'system';
            const senderId = sender === 'Алина' ? 'alina' : sender === 'Даник' ? 'danik' : null;
            const isSelf = senderId === state.account;

            const div = document.createElement('div');
            div.className = 'message';

            if (isSystem) {
                div.classList.add('system');
            } else {
                if (senderId) div.classList.add(senderId);
                if (isSelf) div.classList.add('self');
            }

            const timeStr = timestamp ? formatTime(timestamp) : formatTime(Date.now());

            let senderName = sender || 'Неизвестный';
            if (isSystem) senderName = '';

            div.innerHTML = `
                ${!isSystem ? `<span class="msg-sender">${senderName}</span>` : ''}
                <div class="msg-bubble">${escapeHtml(content)}</div>
                ${!isSystem ? `<span class="msg-time">${timeStr}</span>` : ''}
            `;

            messagesArea.appendChild(div);
            scrollToBottom();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== Add system message =====
        function addSystemMessage(text) {
            renderMessage({
                type: 'system',
                sender: 'Система',
                content: text,
                timestamp: getCurrentTimeISO(),
            });
        }

        // ===== Apply theme =====
        function applyTheme(accountId) {
            const acc = ACCOUNTS[accountId];
            if (!acc) return;

            // Header avatar
            headerAvatar.textContent = acc.avatarLetter;
            headerAvatar.className = 'header-avatar ' + acc.headerClass;

            // Header name
            headerName.textContent = acc.name;

            // Status
            headerStatus.innerHTML =
                `<span class="dot"></span> ${state.connected ? 'Подключено' : 'Ожидание соединения...'}`;
            headerStatus.className = 'header-status' + (state.connected ? '' : ' offline');

            // Input focus
            msgInput.classList.remove('danik-focus');
            if (accountId === 'danik') {
                msgInput.classList.add('danik-focus');
            }

            // Send button
            sendBtn.className = 'send-btn';
            if (accountId === 'danik') {
                sendBtn.classList.add('danik-btn');
            }

            // Update cards selection
            cards.forEach(card => {
                const id = card.dataset.account;
                card.classList.remove('selected-alina', 'selected-danik');
                if (id === accountId) {
                    card.classList.add(id === 'alina' ? 'selected-alina' : 'selected-danik');
                }
            });
        }

        // ===== WebSocket =====
        function connectWebSocket(accountId) {
            if (state.ws) {
                state.ws.close();
                state.ws = null;
            }

            const acc = ACCOUNTS[accountId];
            if (!acc) return;

            statusDot.className = 'status-dot connecting';
            statusText.textContent = 'Подключение...';

            try {
                const ws = new WebSocket(WS_SERVER_URL);
                state.ws = ws;

                ws.onopen = () => {
                    state.connected = true;
                    statusDot.className = 'status-dot connected';
                    statusText.textContent = 'Подключено';
                    headerStatus.innerHTML = `<span class="dot"></span> Подключено`;
                    headerStatus.className = 'header-status';
                    sendBtn.disabled = false;
                    msgInput.disabled = false;
                    msgInput.placeholder = 'Введите сообщение...';
                    // Send join message
                    const joinMsg = {
                        type: 'join',
                        sender: acc.name,
                        content: `${acc.name} присоединился(ась) к чату`,
                        timestamp: getCurrentTimeISO(),
                    };
                    ws.send(JSON.stringify(joinMsg));
                    addSystemMessage(`Вы вошли как ${acc.name}`);
                    scrollToBottom();
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.type === 'message' || data.type === 'join') {
                            if (data.type === 'join') {
                                addSystemMessage(data.content);
                            } else {
                                renderMessage(data);
                            }
                        } else {
                            renderMessage(data);
                        }
                    } catch (e) {
                        console.warn('Не удалось разобрать сообщение:', event.data);
                    }
                };

                ws.onclose = () => {
                    state.connected = false;
                    statusDot.className = 'status-dot disconnected';
                    statusText.textContent = 'Отключено';
                    headerStatus.innerHTML = `<span class="dot"></span> Отключено`;
                    headerStatus.className = 'header-status offline';
                    sendBtn.disabled = true;
                    msgInput.disabled = true;
                    msgInput.placeholder = 'Нет соединения...';
                    // Reconnect after 3s
                    setTimeout(() => {
                        if (state.account) {
                            connectWebSocket(state.account);
                        }
                    }, 3000);
                };

                ws.onerror = (err) => {
                    console.error('WebSocket error:', err);
                    statusText.textContent = 'Ошибка соединения';
                    statusDot.className = 'status-dot disconnected';
                };

            } catch (e) {
                console.error('Не удалось создать WebSocket:', e);
                statusDot.className = 'status-dot disconnected';
                statusText.textContent = 'Ошибка';
                setTimeout(() => {
                    if (state.account) {
                        connectWebSocket(state.account);
                    }
                }, 3000);
            }
        }

        // ===== Send message =====
        function sendMessage() {
            const text = msgInput.value.trim();
            if (!text || !state.connected || !state.account || !state.ws) return;

            const acc = ACCOUNTS[state.account];
            const msg = {
                type: 'message',
                sender: acc.name,
                content: text,
                timestamp: getCurrentTimeISO(),
            };

            try {
                state.ws.send(JSON.stringify(msg));
                renderMessage({ ...msg, sender: acc.name });
                msgInput.value = '';
                msgInput.focus();
            } catch (e) {
                console.error('Ошибка отправки:', e);
                addSystemMessage('Не удалось отправить сообщение');
            }
        }

        // ===== Switch to chat =====
        function enterChat(accountId) {
            const acc = ACCOUNTS[accountId];
            if (!acc) return;

            state.account = accountId;

            // Clear messages
            messagesArea.innerHTML = '';
            addSystemMessage('Добро пожаловать в чат!');

            // Switch screens
            loginScreen.classList.remove('active');
            chatScreen.classList.add('active');

            // Apply theme
            applyTheme(accountId);

            // Connect WebSocket
            connectWebSocket(accountId);

            // Focus input
            setTimeout(() => msgInput.focus(), 300);
        }

        // ===== Go back to login =====
        function goBack() {
            if (state.ws) {
                state.ws.close();
                state.ws = null;
            }
            state.connected = false;
            state.account = null;
            chatScreen.classList.remove('active');
            loginScreen.classList.add('active');
            messagesArea.innerHTML = '';
            addSystemMessage('Добро пожаловать в чат! Выберите аккаунт и начните общение.');
            statusDot.className = 'status-dot disconnected';
            statusText.textContent = 'Не подключено';
        }

        // ===== Event listeners =====

        cards.forEach(card => {
            card.addEventListener('click', () => {
                const accountId = card.dataset.account;
                if (accountId) enterChat(accountId);
            });
        });

        backBtn.addEventListener('click', goBack);
        sendBtn.addEventListener('click', sendMessage);
        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // ===== Init =====
        loginScreen.classList.add('active');
        chatScreen.classList.remove('active');
        addSystemMessage('Добро пожаловать в чат! Выберите аккаунт и начните общение.');
        statusDot.className = 'status-dot disconnected';
        statusText.textContent = 'Не подключено';

        console.log('💬 Чат загружен.');
        console.log(`🔗 WebSocket сервер: ${WS_SERVER_URL}`);
    </script>

</body>
</html>
